<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="CSS/myStyle.css">
    <title>Puppy Lovers Page</title>
</head>

<body>

    <!-- headerSection -->
    <header class="headerSection">
        <h1>Puppy lovers page</h1>
    </header>

    <!-- heroSection -->
    <section class="heroSection">
        <div>
            <img src="images/banner-puppies.jpg" alt="Three puppies in a basket" />
        </div>
    </section>

    <!-- mainContent -->
    <main class="mainContent">

        <!-- featuredGallerySection -->
        <section class="featuredGallerySection">
            <div class="puppy-1">
                <img src="images/puppy-1.jpg" alt="White fluffy puppy" />
            </div>

            <!-- placeholderCard -->
            <div class="placeholderCard">
                Puppy <br> missing <br> here!!
            </div>

            <div class="puppy-2">
                <img src="images/puppy-2.jpg" alt="Black and white puppy side view" />
            </div>
        </section>

        <!-- morePuppiesSection -->
        <section class="morePuppiesSection">
            <div>
                <h1>More Puppies</h1>
            </div>

            <div class="puppyGallery">
                <div class="puppy-3">
                    <img src="images/puppy-3.jpg" alt="Brown puppy being held" />
                </div>

                <di class="puppy-4">
                    <img src="images/puppy-4.jpg" alt="Curly haired puppy lying down" />
                </di>
            </div>
        </section>

    </main>

    <!-- footerSection -->
    <footer class="footerSection">
        <p>Developed by: hana</p>
    </footer>

</body>

</html>
